",title:"Lo Specchio della Torre",icon:"🪞",where:["torre"],text:"Uno specchio alto come la torre. Il riflesso è te, ma con il volto di ciò che il tuo Fardello vuole che tu diventi.",choices:[{text:"Accettare il riflesso",effect:{resonance:3,influence:8},result:"Il riflesso sorride. Il Fardello si fa più pesante e più tuo."},{text:"Frantumarlo",effect:{dissonance:3,nature:"cruel",satchel:{ferro:60}},result:"Mille schegge. Ognuna ha il tuo volto."},{text:"[Sussurri] Chiedere allo specchio la verità",req:{fullscreen:!0},reqText:"Solo nel Rito (fullscreen)",effect:{res:{intuizione:3},flags:["mirror_truth"],xp:60},result:'Lo specchio risponde: "Il Cuore di Krak si nutre di ciò che fingi di non sapere."'}]},{id:"campana",title:"La Campana Muta",icon:"🔔",where:["torre"],text:"Una campana enorme pende da una corda d'ossa. Se suonasse, tutta la torre sentirebbe.",choices:[{text:"Suonarla",effect:{combat:["falena","falena"],resonance:1},result:"DONG. Qualcosa vola verso il rumore!"},{text:"Tagliare la corda in silenzio",effect:{nature:"silent",satchel:{pietra:80,ferro:40}},result:"La campana precipita nell'abisso. Nessuno sente nulla."},{text:"Lasciarla stare",effect:{},result:"Alcune cose devono restare mute."}]},{id:"bilancia",title:"La Bilancia del Giudice",icon:"⚖️",where:["torre","abisso"],text:`Una bilancia d'oro: su un piatto un cuore secco, sull'altro il vuoto. "Pesa ciò che sei disposto a perdere."`,choices:[{text:"Offrire la tua Risonanza",req:{resonance:4},reqText:"Richiede 4 Risonanza",effect:{resonance:-4,reliquie:1,xp:40},result:"La bilancia si inclina. Una reliquia appare sul piatto."},{text:"Offrire il tuo sangue",effect:{hp:-.25,nature:"sacrifice",item:1},result:"Il piatto si arrossa. Ricevi un oggetto antico."},{text:"Offrire la tua Dissonanza",req:{dissonance:5},reqText:"Richiede 5 Dissonanza",effect:{dissonance:-5,corruption:-10},result:"Il peso dell'incoerenza scivola via, per ora."}]},{id:"bambino_spettro",title:"Il Bambino che Chiede il Nome",icon:"👧",w ,result:"Lei stringe il frammento. Non è suo figlio, ma è qualcosa. Pace, per ora."},{text:"Minacciarli di tacere",effect:{nature:"cruel",factions:{contadini:-15,ombre:5},flags:["feared"],corruption:8},result:"Abbassano lo sguardo. Ora sei Temuto. Una via oscura si apre."}]},{id:"elara_bambino",title:"Il Bambino di Elara",icon:"🌿",where:"village",once:!0,cond:e=>qf(e,"p_bambino"),text:"Elara ti chiama. Il bambino salvato quella notte è debole: servono provviste per l'inverno.",choices:[{text:"Donare 8 Provviste",req:{res:{provviste:8}},reqText:"Richiede 8 Provviste",effect:{res:{provviste:-8},nature:"protect",flags:["child_fed"],factions:{guaritori:10}},result:"Il bambino mangia. Elara ti sorride come quella notte."},{text:"Non posso, mi servono per scendere",effect:{factions:{guaritori:-4}},result:"Elara annuisce. Capisce. Non perdona."}]},{id:"testimonianza",title:"Il Testimone",icon:"👁️",where:"village",once:!0,cond:e=>e.fardello==="silenzio"&&e.totals.delves>=1,text:"Il Capitano Marcus e un Eretico incappucciato ti cercano entrambi. Tu hai visto chi ha dato fuoco alla valle quella notte.",choices:[{text:"Testimoniare alla Capitale",effect:{flags:["testified"],factions:{capitale:10,eretici:-8},res:{cenere:120}},result:"Marcus prende nota. Qualcuno verrà impiccato. Forse il colpevole."},{text:"Testimoniare agli Eretici",effect:{flags:["testified","helped_heretics"],factions:{eretici:10,capitale:-8}},result:`L'Eretico annuisce. "La verità brucerà la Capitale."`},{text:"Restare in silenzio",effect:{nature:"silent",resonance:3,influence:6},result:"Il silenzio è il tuo mantello. Si fa più pesante."}]},{id:"vesper_ritorno",title:"Vesper Bussa",icon:"🕯️",where:"village",once:!0,cond:e=>e.fardello==="sangue"&&e.totals.delves>=1,text:`Vesper, l'emissario del Culto, ti attende alla locanda. "Fratello. Il Culto ricorda i suoi debitori. Torna da noi."`,choices:[{text:"Tornare dal Culto",effect:{flags:["returned_cult"],factions:{culto:12,guaritori:-6},nature:"blood",res:{cenere:150}},result:"Il Culto ti accoglie. Il calice ha il sapore del tuo debito."},{text:"Rifiutare",effect:{factions:{culto:-10},dissonance:2},result:'Vesper sorride comunque. "Il sangue torna sempre alla Fonte."'}]},{id:"editto",title:"L'Editto della Capitale",icon:"📜",where:"village",once:!0,cond:e=>e.hero.level>=4,text:"Un araldo affigge un editto: nuove tasse sulle provviste, per finanziare la guerra al Culto.",choices:[{text:"Bruciare l'editto in piazza",effect:{flags:["burned_edict","helped_heretics"],factions:{eretici:10,contadini:6,capitale:-12}},result:"Le fiamme salgono. La piazza applaude. La Capitale prende nota."},{text:"Farlo rispettare",effect:{factions:{capitale:10,contadini:-10},res:{cenere:200}},result:"Le tasse vengono riscosse. Una parte finisce nelle tue tasche."},{text:"Ignorarlo",effect:{nature:"silent"},result:"L'editto sbiadisce sotto la pioggia di cenere."}]},{id:"guardiani_sigillo",title:"Il Sigillo Incrinato",icon:"🗿",where:"village",once:!0,cond:e=>e.totals.delves>=3,text:'Un Guardiano della Valle, coperto di muschio, ti mostra un sigillo antico incrinato. "Krak si sveglia. Servono pietre."',choices:[{text:"Donare 200 Pietra",req:{res:{pietra:200}},reqText:"Richiede 200 Pietra",effect:{res:{pietra:-200},factions:{guardiani:15},prosperity:20,blight:-15,reliquie:1},result:"Il sigillo si ricompone. La valle respira meglio."},{text:"Chiedere cosa c'è sotto",effect:{res:{intuizione:2},flags:["krak_lore"]},result:'"Una voce. Sepolta. Ha la forma di tutte le scelte che non hai fatto."'}]},{id:"ombre_offerta",title:"L'Offerta delle Ombre",icon:"🎭",where:"village",cond:e=>e.reliquie>=1&&e.totals.delves>=2,text:'Una figura senza volto al mercato: "Una reliquia per un frammento di destino. Nessuno saprà."',choices:[{text:"Accettare (1 Reliquia)",req:{reliquie:1},effect:{reliquie:-1,fragment:"random",factions:{ombre:8,gilde:-4}},result:"La figura svanisce. Nella tua mano, un frammento caldo."},{text:"Rifiutare",effect:{factions:{gilde:3}},result:'"Torneremo." Lo dicono tutti.'}]},{id:"altare_nome",title:"L'Altare del Nome",icon:"🕯️",where:"village",once:!0,cond:e=>e.hero.level>=3,text:`Sull'Altare della Veglia, un'incisione: "Chi pronuncia il proprio nome qui, lo lega alla valle."`,choices:[{text:'Pronunciare "{name}"',effect:{flags:["name_spoken"],resonance:3,nature:"faith"},result:"Il tuo nome vibra nella pietra. La valle lo ricorderà, nel bene e nel male."},{text:"Nascondere il tuo nome",effect:{nature:"silent",flags:["name_hidden"]},result:"Nessuno potrà maledire ciò che non conosce."}]},{id:"kael_dubbio",title:"Kael Ti Affronta",icon:"🧔",where:"village",cond:e=>{var i;return T0(e,"kael")<35&&!((i=e.companions.find(a=>a.id==="kael"))!=null&&i.left)},text:'Kael ti blocca la strada. "Ti ho visto. Usi le persone come scudi. Dimmi perché dovrei restare."',choices:[{text:"Chiedere perdono",effect:{trustOf:"kael",trust:25,nature:"faith"},result:`"Un'ultima possibilità." Non sorride, ma resta.`},{text:'"Perché ti servo vivo."',effect:{trustOf:"kael",trust:-30,nature:"cruel"},result:"Kael stringe i pugni. Se la fiducia crolla, se ne andrà."}]},{id:"sogno_tomas",title:"Tomas nel Sogno",icon:"🌀",where:"village",once:!0,cond:e=>e.fardello==="sacrificio"&&e.totals.delves>=4,text:`Stanotte hai sognato Tomas dall'altra parte del portale. Ti ha detto: "Non è stato un sacrificio, se l'hai scelto tu per me."`,choices:[{text:"Accettare la colpa",effect:{influence:10,resonance:3},result:"Il Fardello si incrina. Più pesante, più tuo."},{text:"Rifiutare la colpa",effect:{dissonance:3,corruption:-5},result:"Ti svegli arrabbiato. Il Fardello stride."}]}],xm={p_tomas:{id:"p_tomas",text:"Dirò la verità alla famiglia di Tomas.",deadline:3,keptFlag:"told_truth",brokenFlag:"lied_family"},p_ilyas:{id:"p_ilyas",text:"Tornerò a riprendere Ilyas dal Culto.",deadline:10,keptFlag:"freed_ilyas",brokenFlag:"sold_ilyas_twice"},p_testimone:{id:"p_testimone",text:"Racconterò ciò che ho visto.",deadline:4,keptFlag:"testified"},p_bambino:{id:"p_bam
