 for forgiveness",t2=`Last night you dreamed of Tomas on the other side of the portal. He told you: "It wasn't a sacrifice, if you chose it for me."`,n2="I will tell Tomas's family the truth.",o2="I will leave no one behind.",a2="Stone",r2="Produces wood.",i2="Produces supplies for expeditions.",s2="Produces ash.",l2="Produces stone.",c2="Produces iron.",d2="Travelers' Inn",u2="Watchtower",f2="Timber and roots among the ash.",m2="Trade, risks and news.",p2="Eternal Harvest",h2="Supplies and wood",g2="All production",v2="Expedition duration (−%)",x2="Offline hours counted (+1h)",y2="Damage to raids",b2="Spoils of the Echoes",k2="Ancient Blood",w2="Supplies −20%",j2="Generous Forest",z2="Wood +60%, supplies +20%",C2="Stone −20%",S2="Manual gathering ×3",N2="Production −10%",M2="Land of Monsters",T2="Raids twice as frequent",E2="Buildings −20% cost",q2="Ash −20%",_2="Echo's Wager",P2="It remembers the sound of the millstones.",I2="A memory of summer, before the ash.",L2="Silver Salmon",F2="A day when you laughed.",R2="It has Tomas's eyes.",A2="The oldest memory of Krak.",D2="Eclipse Shard",$2="The valley enters Eclipse for 1 hour: Resonance +50%, shadow enemies.",H2="Next expedition: all intents and liars revealed.",O2="Blood Shard",B2="Next expedition: Dissonance actions +50% damage.",V2="Valley corruption +30: stronger enemies, richer loot.",W2="Voice of the Survivors",U2="+3 Talent Points. Left behind by the Shadow of the Burden.",Y2="Corrupted Shard",G2="Purity Shard",K2="Personal corruption −40, Dissonance −5.",Q2="The valley breathes. Production +25%, prices −10%.",X2="An uncertain silence.",J2="The factions glare at each other. Reputation ×1.5, more raids.",Z2="Enemies +15%, loot +20%.",ek="Path of the Saved",tk="+20% healing",nk="+20% loot",ok="Path of Silence",ak="+15% attack",rk="You drank from the Font.",ik="The Hidden Altar",sk="The Mother",lk="You faced the Mother of Vhalzareth.",ck="You helped the Heretics.",dk="You burned an edict of the Capital.",uk="Re 's a shard in the storehouse that no one remembers bringing. It's warm. It's corrupted.","1rczyvo":"Dream Expedition","14e1d5p":"In a dream you visited a corrupted version of a dungeon you had already explored. You woke up with your pockets full.","4u48f3":"Dream: {title}.","12mgluu":"Lower Hondovalle is your base. Gather by hand, build buildings and let them produce resources on their own: the village works even when the game is closed.",lzt8xz:R3,"1dzw5i2":"Elara, Marcus and Vesper remember your choices. Their words change with their faction's reputation, with your name and with what you have become.","10sdjf9":"Here you see how much the village produces per minute. Feats, Memories, cards and the state of the Valley multiply production.","136a60b":"Dungeons are mirrors of your Burden. Descending costs 1 Supply per floor. What you find goes into the Satchel: it's yours only if you return to the surface. If you fall, you lose three quarters of it. Every 5 floors there's a boss.",z7y1ff:A3,w07brm:D3,yfh8ue:$3,"1w9rrd6":"Tap the water, wait for the bait to sink and tap again at the right moment. Each species you fish up is a memory of the valley: +1% production forever.","1lccnhx":"The map is a constellation. Choices light stars; with Insight you can read others. Here you find Promises, Fate Shards, Contracts and the state of the shared valley.",hen7ct:H3,rfp98f:O3,"1j37nlu":"Storyteller","21hssk":"Every 10 minutes the storyteller tells your story: production ×2 for 90 seconds.",ui0t5d:B3,"1pxh2wc":"Dissonance Actions","6ta1ge":"Dissonance is not just a penalty: you can spend it on powerful but destabilizing actions (Dark Pact, Tactical Betrayal, Supply Pyre). The world notices.",agxkoj:V3,"1ku2eyv":"You can let your hero fight alone: it uses abilities coherent with your Burden, the Echo when it's ready and a potion below the threshold chosen in Options. It never uses Dissonance actions.","1j12oev":"World Boss","13au06e":"Every day all the bearers strike the Ash Colossus. You have 3 attempts of 10 rounds: the more damage you deal, the better the rewards.","1s68eva":"Relics buy permanent upgrades in the Sanctuary. When you close a Cycle you get an ending, permanent Memories, and your bearer becomes an echo that the next ones will meet.","1fnkeaj":"The Burden","14f6fef":"Your first choice has become a mechanical scar. Every Burden has a weight (light = act first, heavy = hit harder), an advantage, a cost, an Echo and a Shadow.","6gf2hh":"Resonance and Dissonance","11oh7bx":"Every action has a nature (protection, sacrifice, cruelty, betrayal, silence, faith, blood). In battle a GREEN border marks an action coherent with your Burden: it charges Resonance; with a full bar you unlock the Echo. A RED border marks a contrary action: it builds Dissonance. No choice is wrong: it is simply yours.","1xwbvkl":"Corruption",frmpvz:W3,tnjma5:U3,epd86a:Y3,"1qrb84e":"After each floor you choose: go deeper (richer, riskier) or go back up to secure the satchel. Without supplies you can pledge future max health: if you return you get half back, if you fall it stays until Elara lifts it.",gf5247:G3,"12qp42s":"Choose an ability and then the target. The basic attack gives Focus (◆); strong abilities consume it. Melee attacks hit only the front row. Above each enemy you see their next move (⚠). Potions don't use up your turn.","1osk8n0":"The Breathing Valley",v5unhk:K3,"1heh7f8":"By turning on fullscreen you enter the Rite: +25% Resonance, whispers in the music and hidden choices in events. With the audio on you see the moves of invisible enemies.",eyhvgh:Q3,uzx8sd:X3,oe2jkv:J3,"1m7bwx2":"Tap «Chop» in the Gathering panel.",dippjv:Z3,fkztvv:e5,"1r9r7uz":"Build a Gatherers' Hut","1nil8s3":"Supplies are needed to descend into dungeons: 1 per floor.","1t78s2h":"Descend into the Cemetery of the Betrayed","17doiwc":"Open the «Descent» tab and press «Descend».",vvwx2w:t5,ut7b5q:n5,r3h9xv:o5,"1o7iobd":"After clearing a floor you can go deeper or «Return to the =>rt(e)>=6,codex:o("Ogni 10 minuti il cantastorie racconta la tua storia: produzione ×2 per 90 secondi.")},{id:"spedizioni",kind:"tab",name:o("Compagni"),icon:"compagni",cond:e=>e.hero.level>=3||(e.village.buildings.locanda||0)>0,codex:o("Kael e Lyra ti seguono nei dungeon. La loro fiducia sale quando proteggi e crolla quando li usi come scudi: sotto 25 esitano, a 0 se ne vanno. Puoi mandarli in spedizioni che durano ore reali, anche a gioco chiuso.")},{id:"f_dark",kind:"feature",name:o("Azioni di Dissonanza"),icon:"dissonanza",cond:e=>e.dissonance>=4||e.hero.level>=5,codex:o("La Dissonanza non è solo una penalità: puoi spenderla per azioni potenti ma destabilizzanti (Patto Oscuro, Tradimento Tattico, Rogo delle Provviste). Il mondo se ne accorge.")},{id:"mercato",kind:"tab",name:o("Mercato delle Anime"),icon:"mercato",cond:e=>e.hero.level>=4||(e.totals.delves||0)>=3,codex:o("Si commercia destino: oggetti con una storia, Frammenti di Fato e risorse. I prezzi dipendono dalle Ombre del Mercato. Ogni scambio resta nello Storico delle Anime.")},{id:"f_auto",kind:"feature",name:o("Auto-battaglia"),icon:"auto",cond:e=>(e.totals.kills||0)>=12,codex:o("Puoi lasciare che il tuo eroe combatta da solo: usa le abilità coerenti col Fardello, l'Eco quando è pronta e una pozione sotto la soglia scelta in Opzioni. Non usa mai azioni di Dissonanza.")},{id:"f_worldboss",kind:"feature",name:o("Boss Mondiale"),icon:"boss",cond:e=>e.hero.level>=6,codex:o("Ogni giorno tutti i portatori colpiscono il Colosso di Cenere. Hai 3 tentativi da 10 round: più danni infliggi, migliori le ricompense.")},{id:"eredita",kind:"tab",name:o("Eredità"),icon:"eredita",cond:e=>e.hero.level>=8||e.cycle.n>1||e.reliquie>=3,codex:o("Le reliquie comprano potenziamenti permanenti nel Santuario. Quando chiudi un Ciclo ottieni un finale, Memorie permanenti, e il tuo portatore diventa un'eco che i successivi incontreranno.")}],C8=[{id:"c_fardello",name:o("Il Fardello"),icon:"fardello",cond:e=>!!e.fardello,text:o("La e si fa più profondo.')}]},{id:"pellegrini",title:o("I Pellegrini Affogati"),icon:"🛶",where:["paludi"],text:o("Una barca si rovescia. Tre pellegrini annaspano nel fango rosso."),choices:[{text:o("Tuffarti a salvarli"),effect:{nature:"protect",hp:-.15,factions:{contadini:5,guaritori:3},xp:30},result:o("Ne salvi due. Il terzo affonda guardandoti.")},{text:o("Prendere le loro borse mentre affondano"),effect:{nature:"cruel",satchel:{cenere:90,provviste:2},corruption:8},result:o("Il fango si richiude su di loro. Le borse sono pesanti.")},{text:o("Pregare per loro e proseguire"),effect:{nature:"faith",resonance:1},result:o("Non puoi salvarli tutti. Lo sai. Fa male lo stesso.")}]},{id:"specchio",title:o("Lo Specchio della Torre"),icon:"🪞",where:["torre"],text:o("Uno specchio alto come la torre. Il riflesso è te, ma con il volto di ciò che il tuo Fardello vuole che tu diventi."),choices:[{text:o("Accettare il riflesso"),effect:{resonance:3,influence:8},result:o("Il riflesso sorride. Il Fardello si fa più pesante e più tuo.")},{text:o("Frantumarlo"),effect:{dissonance:3,nature:"cruel",satchel:{ferro:60}},result:o("Mille schegge. Ognuna ha il tuo volto.")},{text:o("[Sussurri] Chiedere allo specchio la verità"),req:{fullscreen:!0},reqText:o("Solo nel Rito (fullscreen)"),effect:{res:{intuizione:3},flags:["mirror_truth"],xp:60},result:o('Lo specchio risponde: "Il Cuore di Krak si nutre di ciò che fingi di non sapere."')}]},{id:"campana",title:o("La Campana Muta"),icon:"🔔",where:["torre"],text:o("Una campana enorme pende da una corda d'ossa. Se suonasse, tutta la torre sentirebbe."),choices:[{text:o("Suonarla"),effect:{combat:["falena","falena"],resonance:1},result:o("DONG. Qualcosa vola verso il rumore!")},{text:o("Tagliare la corda in silenzio"),effect:{nature:"silent",satchel:{pietra:80,ferro:40}},result:o("La campana precipita nell'abisso. Nessuno sente nulla.")},{text:o("Lasciarla stare"),effect:{},result:o("Alcune cose devono restare mute.")}]},{id:"bilancia",title:o("La Bi
